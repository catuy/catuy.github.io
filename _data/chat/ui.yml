# About extendido: lo primero que ve un visitante frío (sin referrer). Se
# tipea con el mismo ritmo que el resto (typeOut), no se muestra de una.
# Párrafos separados por doble salto de línea (no es un array: acá un array
# significaría "elegir variante al azar", como en `say` de los nodos).
about_extended:
  es: "Hola, soy Diego, diseñador uruguayo radicado en Montevideo. Mi práctica se desarrolla entre el arte y la cultura visual.\n\nConstruyo experiencias de producto pensadas de punta a punta, combinando diseño gráfico, UX y desarrollo creativo. Mis proyectos, que incluyen trabajo con el sector público en Uruguay y en Estados Unidos, tuvieron reconocimiento internacional en instancias como la Bienal de Arquitectura de Venecia, la Bienal Iberoamericana de Diseño de Madrid y el 30 Seconds Museum de Tokio.\n\nAntes fui docente adjunto en la Facultad de Arquitectura, Diseño y Urbanismo de Uruguay, formando a futuros diseñadores — un rol que moldeó mi manera de trabajar en equipo y que todavía inspira lo que hago.\n\nFuera del diseño, exploro el cruce entre arte y tecnología a través de la programación creativa, el sonido y la serigrafía, combinando herramientas y técnicas para correr los límites creativos."
  en: "Hi, I'm Diego, a Uruguayan designer (he/him) based in Montevideo. My practice unfolds between art and visual culture.\n\nI craft thoughtful product experiences through Graphic Design, UX, and Creative Development. My projects, spanning government sectors in Uruguay and the U.S., have earned international recognition at events like the Venice Architecture Biennale, the Ibero-American Design Biennial in Madrid, and the 30 Seconds Museum in Tokyo.\n\nPreviously, I mentored future designers as an associate professor at the Faculty of Architecture, Design, and Urbanism in Uruguay—a role that shaped my collaborative approach and continues to inspire my work.\n\nBeyond design, I explore the intersection of art and technology through creative coding, sound, and screen printing, blending tools and techniques to push creative boundaries."
