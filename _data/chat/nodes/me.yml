# Hub: quién soy. Ver work.yml para las reglas de escritura.

- id: me
  hub: me
  depth: 0
  weight: 5
  audience: [curious, academic, artist, client]
  bridges: [work, art]
  label:
    es: "Tengo curiosidad por vos"
    en: "Just curious about you"
  # Excepción a la regla de "máximo 2 frases" del resto del grafo: es el
  # camino de entrada "conocer más sobre mí", así que se lo trata como el
  # about extendido (mismo criterio que UI.about_extended en ui.yml) — el
  # recorrido profesional completo, no una línea corta. Por eso `say` es un
  # string único con párrafos separados por \n\n, no una lista de variantes.
  say:
    es: "Soy licenciado en Diseño Gráfico (ORT) y arranqué mi carrera en publicidad, en dirección de arte para proyectos audiovisuales. En esos años armé una base sólida en branding, que después fue el puente hacia el diseño de producto. Esa transición empezó en un estudio de diseño que trabajaba con una empresa de instrumentos musicales especializada en sintetizadores. Ahí diseñé las interfaces físicas de los instrumentos, una experiencia que despertó mi interés por el diseño de producto y de interacción. A medida que el trabajo evolucionó, también empecé a diseñar landing pages para esos productos, lo que me llevó a explorar cómo funcionaban las cosas por debajo. Arranqué a meter mano con ActionScript, HTML y CSS, y de a poco me fui convirtiendo en un diseñador capaz de llevar proyectos de punta a punta, desde el concepto y la planificación hasta la implementación.\n\nMi camino después se metió en el sector público, donde trabajé como consultor para varios de los principales organismos del Estado uruguayo, incluyendo diez años de colaboración con la Agencia Nacional de Investigación e Innovación (ANII). En ese rol ayudé a definir la estrategia de diseño de producto de la agencia, armé un sistema de diseño integral, y lideré el diseño de plataformas digitales estatales clave que siguen en uso hoy. Ese trabajo me posicionó como uno de los primeros impulsores de prácticas de diseño de producto a nivel estatal en Uruguay.\n\nEn paralelo a mi práctica profesional, pasé más de diez años como docente en la carrera de Diseño de Comunicación Visual de la Universidad de la República (FADU, UdelaR). Acompañé a cientos de estudiantes en sus proyectos finales, guiándolos en todo el proceso, desde el pensamiento estratégico hasta la ejecución final. Dar clases influyó profundamente en mi forma de liderar, de pensar críticamente y de evaluar decisiones de diseño complejas.\n\nMás recientemente expandí mi trabajo a nivel internacional, colaborando con empresas fintech de Estados Unidos, organizaciones globales como UNESCO, e instituciones internacionales como el Banco Interamericano de Desarrollo (BID). En estos proyectos lideré iniciativas de diseño de punta a punta, desde la estrategia y los sistemas de diseño hasta la implementación en front-end, integrando el diseño en contextos organizacionales complejos y ayudando a construir productos digitales para audiencias globales diversas."
    en: "I hold a degree in Graphic Design and began my career in advertising, working in art direction for audiovisual projects. During those years, I developed a strong foundation in branding, which later became the bridge to product design. That transition started at a design studio collaborating with a musical instrument company specialized in synthesizers. There, I designed the physical interfaces of the instruments, an experience that sparked my interest in product design and interaction. As the work evolved, I also began designing landing pages for these products, which led me to explore how things worked beneath the surface. I started working hands-on with ActionScript, HTML, and CSS, gradually becoming a designer capable of owning projects end to end, from concept and planning to implementation.\n\nMy journey then moved into the public sector, where I worked as a consultant for several leading government agencies in Uruguay, including a ten-year collaboration with the National Agency for Research and Innovation (ANII). In this role, I helped define the agency's product design strategy, built a comprehensive design system, and led the design of key state digital platforms that are still in use today. This work positioned me as an early driver of product design practices at a state level in Uruguay.\n\nAlongside my professional practice, I spent over ten years as a professor in the Design and Visual Communication program at the University of the Republic. I mentored hundreds of students on their final projects, guiding them through the full process, from strategic thinking to final execution. Teaching deeply influenced my approach to leadership, critical thinking, and the evaluation of complex design decisions.\n\nMore recently, I've expanded my work internationally, collaborating with U.S. based fintech companies, global organizations like UNESCO, and international institutions such as the Inter-American Development Bank. Across these projects, I've led end-to-end design initiatives, from strategy and design systems to frontend implementation, embedding design into complex organizational contexts and helping build digital products for diverse, global audiences."

- id: me.who
  hub: me
  depth: 1
  weight: 3
  audience: [curious, client, academic]
  bridges: [work.how, art]
  label:
    es: "¿De dónde venís?"
    en: "Where do you come from?"
  say:
    es: "Soy licenciado en Diseño Gráfico por la ORT y llevo veinte años en esto, siempre desde Montevideo. Diseño, programo y hago arte: nunca me decidí por una sola de las tres."
    en: "I have a degree in Graphic Design from ORT and I've been at this for twenty years, always from Montevideo. I design, I code and I make art: I never picked just one of the three."

- id: me.teach
  hub: me
  depth: 1
  weight: 3
  audience: [academic, artist, curious]
  bridges: [work.how, art.1976]
  label:
    es: "¿Diste clases?"
    en: "Have you taught?"
  say:
    es: "Diez años en la FADU (UdelaR), entre 2013 y 2023, y desde 2015 llevé el Proyecto Final de Carrera en la Licenciatura de Diseño de Comunicación Visual. Acompañé a cientos de estudiantes en sus proyectos."
    en: "Ten years at FADU (UdelaR), between 2013 and 2023, and from 2015 I led the final degree project in the Visual Communication Design program. I've walked hundreds of students through their projects."

- id: me.values
  hub: me
  depth: 1
  weight: 4
  audience: [client, academic, artist]
  bridges: [work.state, art.1976]
  label:
    es: "¿Qué te importa a la hora de elegir un proyecto?"
    en: "What matters to you when picking a project?"
  say:
    es: "Prefiero open source, le escapo al vendor lock-in y me importa la soberanía digital. Me copo con proyectos con propósito: que dejen algo bueno, más justo e inclusivo."
    en: "I prefer open source, I stay away from vendor lock-in and digital sovereignty matters to me. I'm into projects with purpose: ones that leave something good, fairer and more inclusive."
