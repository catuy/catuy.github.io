<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diego — info</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* info hereda el color random del home (?c=) sobre un fondo oscurecido
       para que el texto sea legible, y usa la tipografía de la plantilla. */
    :root{ --theme: #000000; }
    *{ box-sizing: border-box; }
    html, body{ height: 100%; }
    body{
      margin: 0;
      background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)), var(--theme);
      background-attachment: fixed;
      color: #fff;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: var(--font-size-m, 15px);
      line-height: 1.5;
    }
    .info-wrap{
      min-height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 var(--margin, 30px);
    }
    /* ---- header ---- */
    .info-header{
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--margin, 30px) 0 20px;
    }
    .info-header a{
      color: #fff;
      text-decoration: none;
      font-size: var(--font-size-s, 13px);
    }
    .info-header a:hover{ text-decoration: line-through; }
    .info-name{ font-weight: 500; }
    /* ---- conversación ---- */
    .info-log{ flex: 1; padding: 8px 0 20px; }
    .turn{ margin-bottom: 22px; }
    .turn .who{
      display: block;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: .04em;
      text-transform: lowercase;
      color: rgba(255,255,255,.5);
      margin-bottom: 5px;
    }
    .turn .say{ white-space: pre-wrap; word-break: break-word; }
    .turn.you .say{ color: rgba(255,255,255,.6); }
    .info-typing{
      color: rgba(255,255,255,.5);
      font-style: italic;
      font-size: var(--font-size-s, 13px);
      margin-bottom: 22px;
    }
    .blink{ animation: blink .8s steps(1) infinite; }
    @keyframes blink{ 50%{ opacity: 0; } }
    /* ---- input ---- */
    .info-form{
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 14px 0 var(--margin, 30px);
      background: var(--theme);
      box-shadow: 0 -14px 20px -6px var(--theme);
      border-top: 1px solid rgba(255,255,255,.2);
    }
    .info-form .prompt{ font-family: monospace; color: rgba(255,255,255,.5); flex-shrink: 0; }
    .info-input{
      flex: 1;
      font-family: inherit;
      font-size: var(--font-size-m, 15px);
      background: none;
      border: none;
      color: #fff;
      padding: 2px 0;
    }
    .info-input:focus{ outline: none; }
    .info-input::placeholder{ color: rgba(255,255,255,.4); }
    .info-send{
      font-family: monospace;
      font-size: 16px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      padding: 0 2px;
    }
    .info-send:disabled{ color: rgba(255,255,255,.35); cursor: default; }
  </style>
</head>
<body>
  <div class="info-wrap">
    <header class="info-header">
      <a class="info-name" href="./">Diego</a>
      <a href="mailto:hello@persn.net">hello@persn.net</a>
    </header>

    <div class="info-log" id="info-log"></div>

    <div class="info-typing" id="info-typing" hidden>pensando<span class="blink">_</span></div>

    <form class="info-form" id="info-form">
      <span class="prompt" aria-hidden="true">&gt;</span>
      <input class="info-input" id="info-input" type="text" autocomplete="off">
      <button class="info-send" id="info-send" type="submit" aria-label="Enviar">→</button>
    </form>
  </div>

  <script type="module">
  (function () {
    const WORKER_URL = "https://diego-synth-chat.cataldo-diego.workers.dev";
    const MAX_HISTORY_MESSAGES = 8;

    const params = new URLSearchParams(location.search);

    // Color heredado del home (?c=), o el último guardado, o negro por defecto.
    let themeColor = params.get('c');
    if (!themeColor) { try { themeColor = localStorage.getItem('siteColor'); } catch (e) {} }
    if (themeColor) {
      document.documentElement.style.setProperty('--theme', themeColor);
      try { localStorage.setItem('siteColor', themeColor); } catch (e) {}
    }

    const rawLang = (navigator.language || 'es').slice(0, 2).toLowerCase();
    const LANG = rawLang === 'en' ? 'en' : 'es';

    const UI = {
      es: {
        placeholder: 'Escribí lo que quieras…',
        contactFallback: 'Escribime directo y lo vemos: hello@persn.net',
        connectError: 'No pude conectarme ahora. ',
        me: 'diego', you: 'vos'
      },
      en: {
        placeholder: 'Type anything…',
        contactFallback: 'Email me directly: hello@persn.net',
        connectError: "Couldn't connect right now. ",
        me: 'diego', you: 'you'
      }
    };
    const T = UI[LANG];

    // Intro según el sitio de origen (?from=slug). Escritas a mano = sin invento.
    const INTROS = {
      yauguru: {
        es: 'Ah, venís de Yaugurú — ese sitio lo diseñé y desarrollé yo. ¿Te cuento cómo lo pensé, o hablamos de lo tuyo?',
        en: "Ah, you're coming from Yaugurú — I designed and built that site. Want to hear how I approached it, or talk about your project?"
      },
      bardanca: {
        es: 'Ah, venís del sitio de Héctor Bardanca — ese lo diseñé y desarrollé yo. ¿Te cuento cómo lo pensé, o hablamos de lo tuyo?',
        en: "Ah, you're coming from Héctor Bardanca's site — I designed and built that one. Want to hear how I approached it, or talk about your project?"
      },
      texticulos: {
        es: 'Ah, venís de textículos, el sitio de Maca — ese lo diseñé y desarrollé yo. ¿Te cuento cómo lo pensé, o hablamos de lo tuyo?',
        en: "Ah, you're coming from textículos, Maca's site — I designed and built that one. Want to hear how I approached it, or talk about your project?"
      },
      alter: {
        es: 'Ah, venís de Alter Ediciones — ese sitio lo diseñé y desarrollé yo. ¿Te cuento cómo lo pensé, o hablamos de lo tuyo?',
        en: "Ah, you're coming from Alter Ediciones — I designed and built that site. Want to hear how I approached it, or talk about your project?"
      }
    };
    const DEFAULT_INTRO = {
      es: 'Hola, soy Diego. Podés llamarme diseñador si querés — me muevo entre lo visual y el código. Preguntame lo que quieras.',
      en: "Hi, I'm Diego. You can call me a designer if you want — I live between visuals and code. Ask me anything."
    };

    const logEl = document.getElementById('info-log');
    const typingEl = document.getElementById('info-typing');
    const form = document.getElementById('info-form');
    const input = document.getElementById('info-input');
    const sendBtn = document.getElementById('info-send');

    input.placeholder = T.placeholder;

    let history = [];

    function addTurn(role, text) {
      const turn = document.createElement('div');
      turn.className = 'turn ' + (role === 'diego' ? 'diego' : 'you');
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = role === 'diego' ? T.me : T.you;
      const say = document.createElement('div');
      say.className = 'say';
      say.textContent = text;
      turn.append(who, say);
      logEl.appendChild(turn);
      window.scrollTo(0, document.body.scrollHeight);
      return say;
    }

    const from = (params.get('from') || '').toLowerCase();
    const intro = INTROS[from] || DEFAULT_INTRO;
    addTurn('diego', intro[LANG]);
    input.focus();

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.disabled = true;
      sendBtn.disabled = true;

      addTurn('you', text);
      history.push({ role: 'user', content: text });
      history = history.slice(-MAX_HISTORY_MESSAGES);

      typingEl.hidden = false;
      let sayEl = null;
      let acc = '';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history, lang: LANG, from: from })
        });

        if (!res.ok || !res.body) throw new Error('Worker respondió ' + res.status);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const events = buffer.split('\n\n');
          buffer = events.pop();

          for (const evt of events) {
            const line = evt.trim();
            if (!line.startsWith('data:')) continue;
            const data = line.slice(5).trim();
            if (data === '[DONE]') continue;

            try {
              const parsed = JSON.parse(data);
              const delta = parsed.response || '';
              if (delta) {
                if (!sayEl) { typingEl.hidden = true; sayEl = addTurn('diego', ''); }
                acc += delta;
                sayEl.textContent = acc;
                window.scrollTo(0, document.body.scrollHeight);
              }
            } catch (e) { /* chunk parcial */ }
          }
        }

        if (!acc) throw new Error('Respuesta vacía del Worker');
        history.push({ role: 'assistant', content: acc });
      } catch (err) {
        console.error(err);
        const errText = T.connectError + T.contactFallback;
        if (sayEl) sayEl.textContent = errText;
        else addTurn('diego', errText);
      } finally {
        typingEl.hidden = true;
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    });
  })();
  </script>
</body>
</html>
