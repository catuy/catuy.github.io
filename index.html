<script>
 $(document).ready(function(){
  var scripts = [
      'heads/1.js',
      'heads/2.js',
      'heads/3.js'
      // 'heads/4.js',
      // 'heads/5.js',
      // 'heads/6.js',
      // 'heads/7.js',
      // 'heads/8.js',
      // 'heads/9.js',
      // 'heads/10.js'
  ];

  // Selecciona aleatoriamente un script sin almacenar en caché
  var scriptPath = scripts[Math.floor(Math.random() * scripts.length)];

  // Crea un elemento script y lo añade al head
  var script = document.createElement('script');
  script.src = scriptPath;
  document.getElementsByTagName('head')[0].appendChild(script);

  $('header nav ul li:first-child').attr('id', 'nav-home');
  $(document).on('click', '#nav-home', function() {
      // Selección aleatoria cada vez que se hace clic
      var scriptPath = scripts[Math.floor(Math.random() * scripts.length)];
      var script = document.createElement('script');
      script.src = scriptPath;
      document.getElementsByTagName('head')[0].appendChild(script);
  });
});
</script>
<script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  document.body.style.opacity = 0;
  document.body.style.transition = "opacity 200ms";
  setTimeout(function() {
    document.body.style.opacity = 1;
  }, 100);

  var altoImagen = $(".filtered").height();
  $(document).mousemove(function(event){
    $(".filtered").offset({
      left: event.pageX + 20,
      top: event.pageY - altoImagen / 2
    });
  });
});
</script>

<script>
  // Al ir a info le paso: el ?from (si el visitante viene de un sitio que hice yo)
  // y el color actual de la cabeza, para que info herede el color random del home.
  (function(){
    var from = new URLSearchParams(location.search).get('from');
    var link = document.getElementById('nav-info');
    link.addEventListener('click', function(e){
      e.preventDefault();
      var q = [];
      if (from) q.push('from=' + encodeURIComponent(from));
      var c = getComputedStyle(document.documentElement).getPropertyValue('--color-primary').trim();
      if (c) {
        q.push('c=' + encodeURIComponent(c));
        try { localStorage.setItem('siteColor', c); } catch (err) {}
      }
      location.href = 'info.html' + (q.length ? '?' + q.join('&') : '');
    });
  })();
</script>
