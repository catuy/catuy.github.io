tras sacar la experiencia agéntica — ver HANDOFF.md.

<script>
(function () {
  var rawLang = (navigator.language || 'es').slice(0, 2).toLowerCase();

  // Mismo breakpoint que usa el CSS (max-width: 768px, ver styles.scss).

  var GRAPH = JSON.parse(document.getElementById('chat-graph').textContent);

  var logEl = document.getElementById('chat-log');

  //  ------------------------------------------
  //  Helpers
  //  ------------------------------------------

  // Devuelve el texto en el idioma actual. Si el YAML trae una lista, elige una
  // variante al azar.
  function t(field) {
    if (!field) return '';
    var val = field[LANG] != null ? field[LANG] : field.es;
    if (Array.isArray(val)) return val[Math.floor(Math.random() * val.length)];
    return val || '';
  }

  function scrollToEnd() { window.scrollTo(0, document.body.scrollHeight); }

  function referrerNode() {
    var refs = (GRAPH.nodes && GRAPH.nodes.referrer) || [];
    for (var i = 0; i < refs.length; i++) {
      if (refs[i].slug === from) return refs[i];

  //  ------------------------------------------
  //  Texto narrador: un solo slot a la vez (sin historial), tipeado
  //  ------------------------------------------

  function clearLog() {
    Array.prototype.slice.call(logEl.children).forEach(function (el) {

  function addTurn(text) {
    var turn = document.createElement('div');
    turn.className = 'chat-turn diego';
    var say = document.createElement('div');
    say.className = 'chat-say';
    turn.appendChild(say);
    logEl.insertBefore(turn, srEl);

    return say;
  }

  // Ritmo tipo streaming de un LLM (ChatGPT/Claude): trozos de varios
  // caracteres por tick, no letra por letra. En mobile aparece de una —
  // Diego lo pidió así, el efecto no sumaba ahí.
  function typeOut(el, text, done) {
    if (IS_MOBILE) {
      el.textContent = text;
      srEl.textContent = text;
      if (done) done();
      return;
    }
    var i = 0;
    el.textContent = '';
    (function step() {
      i += 3 + Math.floor(Math.random() * 4);
      el.textContent = text.slice(0, i);
      scrollToEnd();
      if (i < text.length) { setTimeout(step, 8 + Math.random() * 7); return; }
      srEl.textContent = text; // se anuncia una vez, ya terminado de tipear
      if (done) done();
    })();
  }

  // Usado tanto para el saludo inicial como para cada comentario de imagen:
  // reemplaza lo que hubiera antes por el texto nuevo, tipeado.
  function showText(text) {
    clearLog();
    var say = addTurn(text);
    typeOut(say, text, function () {});

  //  ------------------------------------------

  // `slug`/`label` NO se usan por ahora (la galería es puramente visual:
  // se apila sobre el about fijo, sin URL por proyecto) — quedan en los
  // datos por si se retoma más adelante. `comment` SÍ se usa ahora: es el
  // caption que se ve sólo con la ventana ampliada (ver reveal()/CSS de
  // `.gallery-window-caption`).
  // `poster`: portada estática de cada .mp4 (ver reveal()/expand()/
  // collapse() — sólo reproducen ampliados, en chico se ve la portada).
  var GALLERY_IMAGES = [
    {
      src: '/assets/blogimages/tiles/atlas-1.mp4', poster: '/assets/blogimages/tiles/atlas-1-poster.jpg', alt: 'Atlas',

      },

      src: '/assets/blogimages/tiles/seri1.png', alt: 'Serigraphic Work',
      slug: 'serigraphic-work', label: 'Serigraphic Work',
      comment: {
        es: "Hice serigrafías premiadas en las bienales de Taiwán y Portugal.",
        en: "I made screen prints awarded at the Taiwan and Portugal biennials.",
      },
    },
    {
      src: '/assets/blogimages/tiles/seri2.png', alt: 'Serigraphic Work',
      slug: 'serigraphic-work', label: 'Serigraphic Work',
      comment: {
        es: "Hice serigrafías premiadas en las bienales de Taiwán y Portugal.",
        en: "I made screen prints awarded at the Taiwan and Portugal biennials.",
      },
    },
    {
      src: '/assets/blogimages/tiles/shibuya-1.mp4', poster: '/assets/blogimages/tiles/shibuya-1-poster.jpg', alt: 'Neo Shibuya TV',
      slug: 'neo-shibuya-tv', label: 'Neo Shibuya TV',
      comment: {
        es: "Uno de mis proyectos de creative coding se exhibió en Shibuya, Tokio, como parte del NEO Shibuya TV Art Project.",
        en: "One of my creative coding projects was exhibited in Shibuya, Tokyo, as part of the NEO Shibuya TV Art Project.",
      },
    },
  ];

  // Misma mecánica que assets/script.js (detalle de proyecto, hoy oculto
  // del build): cada click en un área vacía apila una ventana nueva
  // arrastrable (jQuery UI .draggable(), ya cargado site-wide vía
  // head.html), centrada en el punto de click, con z-index creciente —
  // las anteriores quedan en pantalla, no se reemplazan. Tocar una ventana
  // existente la trae al frente (mousedown) y, si no fue un drag real,
  // también apila una nueva encima (jQuery UI suprime el click nativo que
  // sigue a un drag real, así que no hace falta distinguirlos a mano). El
  // cursor ambiente (siempre presente en /info/) lo maneja footer.html,
  // acá sólo el click-to-reveal. Sólo se ignoran los clicks sobre
  // elementos interactivos reales (el link de mail del footer, la X de
  // cerrar, etc.).
  //
  // Cola, no cursor lineal: `queue` arranca como una copia de
  // GALLERY_IMAGES y cada reveal saca la primera (`shift`). Cerrar una
  // ventana (botón `×` en el header) la devuelve al FINAL de la cola
  // (`push`) en vez de borrarla — un próximo click la vuelve a mostrar. Con
  // todo revelado y nada cerrado, la cola queda vacía y un click más no
  // hace nada; en cuanto se cierra algo, vuelve a haber algo para mostrar.
  function startProjectGallery() {
    var queue = GALLERY_IMAGES.slice();
    var z = 10;
    // Por encima de cualquier z de ventana normal: el backdrop bloquea todo
    // lo demás, y la ventana expandida va justo arriba del backdrop.
    var Z_BACKDROP = 9000, Z_EXPANDED = 9001;
    // Sólo puede haber una ventana ampliada a la vez (ver expand()/collapse()
    // más abajo). Mientras haya una, reveal() no debe apilar ventanas nuevas
    // — el backdrop bloquea los clicks sobre el resto de la pantalla, pero
    // NO los clicks sobre la propia imagen ampliada (no tiene por qué
    // frenarlos ella misma), que si no burbujean a document igual.
    var activeExpanded = null;
    // Sólo en mobile: una sola imagen visible a la vez (ver reveal() más
    // abajo) — guarda la ventana/imagen actual para poder sacarla antes
    // de mostrar la siguiente. En desktop queda siempre en null, sin usarse.
    var mobileWin = null;
    // Sólo en desktop: nunca más de 3 ventanas visibles a la vez — cola
    // FIFO de las últimas reveladas (no de z-index/orden al frente). Al
    // aparecer una 4ª, se saca la más vieja (ver reveal()). En mobile
    // queda siempre vacío (ahí manda `mobileWin`, tope de 1).
    var desktopWindows = [];

    // La transition va inline, sólo mientras dura expand()/collapse() — si
    // viviera en el CSS de .gallery-window, tanto arrastrar (jQuery UI pisa
    // left/top en cada mousemove) como el reposicionamiento al aparecer
    // (pic.onload, más abajo) quedarían con el mismo delay animado, que no
    // se quiere ahí.
    var TRANSITION_MS = 350;
    function animateOn(win, pic) {
      win.style.transition = 'left ' + TRANSITION_MS + 'ms ease, top ' + TRANSITION_MS + 'ms ease';
      pic.style.transition = 'width ' + TRANSITION_MS + 'ms ease, height ' + TRANSITION_MS + 'ms ease';
    }
    function animateOffLater(win, pic) {
      setTimeout(function () {
        win.style.transition = '';
        pic.style.transition = '';
      }, TRANSITION_MS);
    }

    // Corchetes en diagonal — mismo glyph que reproductores/visores nativos
    // usan para "pantalla completa" (hacia afuera) y "salir" (hacia adentro).
    var EXPAND_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">'
      + '<path d="M9 3H3v6M15 21h6v-6" fill="none" stroke="currentColor" stroke-width="2" '
      + 'stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var COMPRESS_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">'
      + '<path d="M3 9h6V3M21 15h-6v6" fill="none" stroke="currentColor" stroke-width="2" '
      + 'stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function isInteractive(target) {
      return !!target.closest('a, button, input');
    }

    function isVideo(src) {
      return /\.mp4$/i.test(src);
    }

    // Tamaño real del media: naturalWidth/Height para <img>. Para <video>
    // NO se usa videoWidth/Height (el .mp4 todavía no se descargó — ver
    // reveal(), preload="none" a propósito) sino `_naturalSize`, tomado de
    // la portada estática (misma proporción que el video).
    function mediaSize(pic) {
      if (pic.tagName === 'VIDEO') return pic._naturalSize || { w: pic.videoWidth, h: pic.videoHeight };
      return { w: pic.naturalWidth, h: pic.naturalHeight };
    }

    // Ampliar/achicar estilo lightbox: centra y agranda hasta EXPAND_CAP del
    // viewport sin pasar el tamaño natural de la imagen (se calcula una
    // sola vez, no se lee el layout a mitad de la transición CSS), bloquea
    // y difumina el fondo con un backdrop, y guarda posición/tamaño de
    // origen para volver exacto (aunque la ventana se haya arrastrado antes
    // de expandir). Deja margen abajo para el caption (ver reveal()), que
    // ahora cuelga afuera de la ventana en vez de ir adentro.
    var EXPAND_CAP = 0.75;
    function expand(win, pic, header, expandBtn) {
      var size = mediaSize(pic);
      var naturalW = size.w, naturalH = size.h;
      var scale = Math.min(1, (window.innerWidth * EXPAND_CAP) / naturalW, (window.innerHeight * EXPAND_CAP) / naturalH);
      var targetImgW = naturalW * scale;
      var targetImgH = naturalH * scale;
      var targetLeft = (window.innerWidth - targetImgW) / 2;
      var targetTop = (window.innerHeight - (targetImgH + header.offsetHeight)) / 2;

      win._restoreState = {
        left: win.style.left, top: win.style.top,
        imgWidth: pic.style.width, imgHeight: pic.style.height,
      };

      $(win).draggable('disable');
      win.classList.add('expanded');
      win.style.zIndex = Z_EXPANDED;
      activeExpanded = win;

      var backdrop = document.createElement('div');
      backdrop.className = 'gallery-backdrop';
      backdrop.style.zIndex = Z_BACKDROP;
      backdrop.addEventListener('click', function (ev) {
        ev.stopPropagation(); // si no, burbujea a document y revela una imagen de más
        collapse(win, pic, header, expandBtn);
      });
      document.body.appendChild(backdrop);
      win._backdrop = backdrop;

      function onKeydown(ev) {
        if (ev.key === 'Escape') collapse(win, pic, header, expandBtn);
      }
      win._onKeydown = onKeydown;
      document.addEventListener('keydown', onKeydown);

      animateOn(win, pic);
      pic.style.width = targetImgW + 'px';
      pic.style.height = targetImgH + 'px';
      win.style.left = targetLeft + 'px';
      win.style.top = targetTop + 'px';
      animateOffLater(win, pic);

      // Los .mp4 sólo reproducen mientras están ampliados: en chico se ve
      // la portada estática, quieta (ver reveal()). play() dispara la
      // descarga (preload="none") si todavía no había arrancado.
      if (pic.tagName === 'VIDEO') pic.play();

      expandBtn.innerHTML = COMPRESS_ICON;
      expandBtn.setAttribute('aria-label', 'Achicar');
    }

    function collapse(win, pic, header, expandBtn) {
      var st = win._restoreState;
      if (win._backdrop) { win._backdrop.remove(); win._backdrop = null; }
      if (win._onKeydown) { document.removeEventListener('keydown', win._onKeydown); win._onKeydown = null; }

      win.classList.remove('expanded');
      animateOn(win, pic);
      win.style.left = st.left;
      win.style.top = st.top;
      pic.style.width = st.imgWidth;
      pic.style.height = st.imgHeight;
      animateOffLater(win, pic);
      // load() (no sólo pause()) para que vuelva a mostrar la portada en
      // vez de quedar congelado en el último frame reproducido — reinicia
      // el elemento a su estado sin datos cargados (preload="none"), así
      // que la próxima reproducción vuelve a descargar desde el principio.
      if (pic.tagName === 'VIDEO') { pic.pause(); pic.load(); }
      $(win).draggable('enable');
      z += 1;
      win.style.zIndex = z; // vuelve a "al frente de lo normal", no a su z viejo
      activeExpanded = null;

      expandBtn.innerHTML = EXPAND_ICON;
      expandBtn.setAttribute('aria-label', 'Ampliar');
    }

    // Saca una ventana de encima (misma limpieza que hacía el botón × antes
    // de sacárselo en mobile — ver `closeBtn` más abajo, sigue existiendo
    // para desktop) y devuelve su imagen al final de la cola.
    function removeWindow(win, img) {
      if (win.classList.contains('expanded')) {
        if (win._backdrop) win._backdrop.remove();
        if (win._onKeydown) document.removeEventListener('keydown', win._onKeydown);
        activeExpanded = null;
      }
      win.remove();
      queue.push(img);
    }

    function reveal(ev) {
      if (activeExpanded) return; // no apilar nada mientras hay una ampliada
      if (isInteractive(ev.target)) return;
      if (!queue.length) return;

      // Sólo en mobile: nunca más de una imagen en pantalla — la anterior
      // se saca (vuelve al final de la cola) antes de mostrar la
      // siguiente. En desktop `mobileWin` nunca se setea, esto no hace nada.
      if (IS_MOBILE && mobileWin) {
        removeWindow(mobileWin.win, mobileWin.img);
        mobileWin = null;
      }
      // Sólo en desktop: al llegar a 3 visibles, la 4ª saca a la más
      // vieja (FIFO) antes de aparecer.
      if (!IS_MOBILE && desktopWindows.length >= 3) {
        var oldest = desktopWindows.shift();
        removeWindow(oldest.win, oldest.img);
      }

      var img = queue.shift();
      var win = document.createElement('div');
      win.className = 'gallery-window';
      win.style.left = ev.clientX + 'px';
      win.style.top = ev.clientY + 'px';
      z += 1;
      win.style.zIndex = z;

      var header = document.createElement('div');
      header.className = 'gallery-window-header';
      win.appendChild(header);

      var expandBtn = document.createElement('button');
      expandBtn.type = 'button';
      expandBtn.className = 'gallery-window-expand';
      expandBtn.setAttribute('aria-label', 'Ampliar');
      expandBtn.innerHTML = EXPAND_ICON;
      header.appendChild(expandBtn);

      var closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.className = 'gallery-window-close';
      closeBtn.setAttribute('aria-label', 'Cerrar');
      closeBtn.textContent = '×';
      header.appendChild(closeBtn);

      var video = isVideo(img.src);
      var pic = document.createElement(video ? 'video' : 'img');
      var recenter = function () {
        win.style.left = (ev.clientX - win.offsetWidth / 2) + 'px';
        win.style.top = (ev.clientY - win.offsetHeight / 2) + 'px';
      };
      if (video && IS_MOBILE) {
        // En mobile no hay "ampliar" (los botones están ocultos, ver
        // styles.scss) — la miniatura ES la vista final, no tiene sentido
        // dejarla en la portada estática esperando un expand() que acá no
        // existe. Reproduce directo: sin preload="none" (si no, nunca
        // arranca sola), y usa `loadeddata` (no `onload`, que <video> no
        // dispara) para recentrar una vez que se conoce el tamaño real.
        pic.loop = true;
        pic.muted = true;
        pic.playsInline = true;
        pic.autoplay = true;
        pic.alt = img.alt;
        pic.addEventListener('loadeddata', recenter);
      } else if (video) {
        // En chico se ve quieta (portada estática, sin descargar el .mp4
        // todavía): sólo reproduce al ampliar (expand()/collapse() más
        // arriba) — así no hay 22 videos corriendo a la vez en pantalla.
        pic.loop = true;
        pic.muted = true;
        pic.playsInline = true;
        pic.preload = 'none';
        pic.alt = img.alt;
        if (img.poster) pic.poster = img.poster;
        // El tamaño para centrar/expandir sale de la portada, no del video
        // (que con preload="none" todavía no tiene videoWidth/Height).
        var coverProbe = new Image();
        coverProbe.onload = function () {
          pic._naturalSize = { w: coverProbe.naturalWidth, h: coverProbe.naturalHeight };
          recenter();
        };
        if (img.poster) coverProbe.src = img.poster;
      } else {
        pic.alt = img.alt;
        pic.onload = recenter;
      }
      pic.src = img.src;
      win.appendChild(pic);

      // Sólo visible ampliada, colgando AFUERA de la ventana (position:
      // absolute, top:100% — ver .gallery-window-caption en styles.scss,
      // atado a .expanded) — texto fijo al crear la ventana, no hace falta
      // tocarlo en expand()/collapse().
      if (img.comment) {
        var caption = document.createElement('div');
        caption.className = 'gallery-window-caption';
        caption.textContent = t(img.comment);
        win.appendChild(caption);
      }

      expandBtn.addEventListener('click', function () {
        if (win.classList.contains('expanded')) { collapse(win, pic, header, expandBtn); return; }
        // Bug real (no sólo de CSS): `z` no tiene techo — sube con cada
        // reveal()/mousedown-al-frente, así que en una sesión larga puede
        // superar Z_BACKDROP/Z_EXPANDED (9000/9001). Si eso pasa, una
        // ventana normal puede terminar con z-index más alto que el
        // backdrop de OTRA que ya está ampliada, quedando clickeable por
        // encima de él — clickear su "Ampliar" abría una segunda
        // expand() sin que la primera se cerrara nunca, dejando su
        // backdrop huérfano (nadie vuelve a sacarlo) bloqueando clicks en
        // el resto de la página para siempre. `reveal()` ya se protegía
        // con `activeExpanded`; acá faltaba el mismo guard.
        if (activeExpanded && activeExpanded !== win) return;
        expand(win, pic, header, expandBtn);
      });

      closeBtn.addEventListener('click', function () {
        removeWindow(win, img);
        if (mobileWin && mobileWin.win === win) mobileWin = null;
        var idx = desktopWindows.findIndex(function (w) { return w.win === win; });
        if (idx !== -1) desktopWindows.splice(idx, 1);
      });

      document.body.appendChild(win);
      if (IS_MOBILE) mobileWin = { win: win, img: img };
      else desktopWindows.push({ win: win, img: img });
      win.addEventListener('mousedown', function () {
        if (win.classList.contains('expanded')) return; // no compite con Z_EXPANDED
        z += 1;
        win.style.zIndex = z;
      });
      $(win).draggable({ cancel: '.gallery-window-close, .gallery-window-expand' });
    }
    document.addEventListener('click', reveal);
  }

  //  ------------------------------------------
  //  Arranque
  //  ------------------------------------------

  // Saludo de referrer (?from=<slug>) DESACTIVADO a propósito (Diego, 2026-07-29):
  // el link ?from= ya está publicado en varios sitios externos y no quiere
  // que salga ese saludo por ahora — pero el desarrollo se queda intacto
  // (referrer.yml, referrerNode(), sessionStorage.chatFrom en footer.html)
  // para reactivarlo más adelante: alcanza con volver esto a `true`.
  var REFERRER_GREETING_ENABLED = false;
  var from = (sessionStorage.getItem('chatFrom') || '').toLowerCase();
  var ref = REFERRER_GREETING_ENABLED ? referrerNode() : null;
  var introText = ref ? t(ref.intro) : t(UI.about_extended);
  showText(introText);
  startProjectGallery();
})();
</script>
