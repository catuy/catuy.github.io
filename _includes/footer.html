<script>
   $(document).ready(function(){
    // los sitios externos linkean a la home con ?from=<slug>; se guarda para
    // que el chat de /info/ lo lea al navegar ahí (ya no llega por URL).
    if (location.pathname === '/') {
        var from = new URLSearchParams(location.search).get('from');
        if (from) {
            try { sessionStorage.setItem('chatFrom', from.toLowerCase()); } catch (err) {}
        }
    }

    // array of file paths
    var scripts = [
        '/assets/heads/1.js',
        '/assets/heads/2.js',
        '/assets/heads/3.js',
        // '/assets/heads/4.js',
        // '/assets/heads/5.js',
        // '/assets/heads/6.js',
        // '/assets/heads/7.js',
        // '/assets/heads/8.js',
        // '/assets/heads/9.js',
        // '/assets/heads/10.js'
    ];

    // check if script path is already stored in sessionStorage
    var scriptPath = sessionStorage.getItem('scriptPath');

    if (!scriptPath) {
        // if not, randomly select a path from the array
        scriptPath = scripts[Math.floor(Math.random() * scripts.length)];
        // store the path in sessionStorage
        sessionStorage.setItem('scriptPath', scriptPath);
    }

    // create a script element
    var script = document.createElement('script');
    // set the source to the selected/stored path
    script.src = scriptPath;
    // once the head script ran, --color-primary is set: paint the favicon with it
    script.onload = function () {
        var color = getComputedStyle(document.documentElement)
            .getPropertyValue('--color-primary').trim() || '#000';
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">'
            + '<circle cx="50" cy="50" r="47" fill="' + color + '"/></svg>';
        var favicon = document.getElementById('favicon');
        if (favicon) {
            favicon.type = 'image/svg+xml';
            favicon.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
        }
    };
    // append the script to the head of the document
    document.getElementsByTagName('head')[0].appendChild(script);

    // El color/cabeza queda fijo durante toda la sesión (sessionStorage).
    // Solo el botón Shuffle (en la home) lo cambia, limpiando la clave y recargando.

});
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    document.body.style.opacity = 0;
    document.body.style.transition = "opacity 200ms";
    setTimeout(function() {
      document.body.style.opacity = 1;
    }, 100);

    var altoImagen = $(".filtered").height();
    $(document).mousemove(function(event){
    $(".filtered").offset({
      left: event.pageX + 20,
      top: event.pageY - altoImagen / 2
    });
  });
  });

<script>
  // Cursor ambiente (círculo que sigue al mouse con lag): un dado en /info/,
  // blanco y circular en la home, siempre presente en esas dos páginas — no
  // depende del chat ni de ningún click (a diferencia de startProjectGallery
  // en info-chat.html, que sólo agrega el click-to-reveal de proyectos). El
  // dado en sí ya es la pista de "clickear acá avanza la galería" — antes
  // había además un hint de texto ("click") hasta el primer click del
  // visitante, se sacó por quedar redundante con el dado.
  //
  // Mismo mapa de caras que el botón Shuffle de home.html (#shuffle-die) —
  // duplicado a propósito: son dos vistas visuales independientes (botón
  // vs. cursor ambiente), no vale la pena una dependencia cruzada por unas
  // pocas líneas de datos. El dibujo SÍ difiere del de Shuffle: acá es un
  // cuadrado RELLENO (currentColor) con puntos blancos, no un marco con
  // trazo — Diego lo pidió así para que se distinga como icono de cursor,
  // no como botón.
  var DIE_FACES = {
    1: [[12, 12]],
    2: [[8, 8], [16, 16]],
    3: [[8, 8], [12, 12], [16, 16]],
    4: [[8, 8], [16, 8], [8, 16], [16, 16]],
    5: [[8, 8], [16, 8], [12, 12], [8, 16], [16, 16]],
    6: [[8, 8], [16, 8], [8, 12], [16, 12], [8, 16], [16, 16]],
  };
  var SVG_NS = "http://www.w3.org/2000/svg";
  function buildDieSvg() {
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("width", "22");
    svg.setAttribute("height", "22");
    svg.setAttribute("aria-hidden", "true");
    var rect = document.createElementNS(SVG_NS, "rect");
    rect.setAttribute("x", "3");
    rect.setAttribute("y", "3");
    rect.setAttribute("width", "18");
    rect.setAttribute("height", "18");
    rect.setAttribute("rx", "4");
    rect.setAttribute("ry", "4");
    rect.setAttribute("fill", "currentColor");
    svg.appendChild(rect);
    return svg;
  }
  function setDieFace(svg, face) {
    // El primer hijo es el fondo (rect) — se conserva, se sacan sólo los
    // puntos de la cara anterior.
    while (svg.childNodes.length > 1) svg.removeChild(svg.lastChild);
    DIE_FACES[face].forEach(function (pt) {
      var dot = document.createElementNS(SVG_NS, "circle");
      dot.setAttribute("cx", pt[0]);
      dot.setAttribute("cy", pt[1]);
      dot.setAttribute("r", "1.6");
      dot.setAttribute("fill", "white");
      svg.appendChild(dot);
    });
  }
  function randomFace() { return 1 + Math.floor(Math.random() * 6); }

  document.addEventListener("DOMContentLoaded", function () {
    var dot = document.createElement("div");
    dot.className = "cursor-dot";

    var isInfo = document.body.classList.contains("layout-info");
    var dieSvg = null;

    if (isInfo) {
      dieSvg = buildDieSvg();
      setDieFace(dieSvg, randomFace());
      dot.appendChild(dieSvg);
      dot.classList.add("die");
    } else {
      // Home: siempre círculo, sin dado — sin cambios de comportamiento acá.
      dot.classList.add("circle");
    }

    document.body.appendChild(dot);

    // Mientras una ventana de la galería está ampliada (lightbox), el dado
    // no tiene sentido: clickear ahí no avanza a la imagen siguiente (ver
    // el guard `if (activeExpanded) return;` de reveal() en
    // info-chat.html) — el punto queda en círculo todo ese tiempo, sin
    // importar sobre qué esté el mouse. expand()/collapse() en
    // info-chat.html prenden/apagan esto vía lock()/unlock() más abajo, el
    // mismo hook `window.__infoCursorDie` que ya usan para animar el dado
    // al revelar.
    var expandedLock = false;
    var lastTarget = null;
    function showCircle() {
      dot.classList.remove("die");
      dot.classList.add("circle");
      dieSvg.style.display = "none";
    }
    function showDie() {
      dot.classList.remove("circle");
      dot.classList.add("die");
      dieSvg.style.display = "";
    }
    function isOverUi() {
      return expandedLock || !!(lastTarget && lastTarget.closest && lastTarget.closest("a, button, input"));
    }

    var targetX = 0, targetY = 0, curX = 0, curY = 0;
    document.addEventListener("mousemove", function (ev) {
      targetX = ev.clientX;
      targetY = ev.clientY;
      lastTarget = ev.target;

      // En /info/, pasar sobre un link/botón/input (ampliar, cerrar, el nav
      // ".. / Info", el mail, etc.) vuelve el cursor a un punto simple — el
      // dado es la seña de "clickear acá avanza la galería", así que no
      // tiene sentido mostrarlo sobre algo que hace otra cosa. Se resuelve
      // acá, no con mouseenter/mouseleave: `ev.target` en mousemove YA es el
      // elemento bajo el cursor en cada instante, sin el lío de bubbling que
      // tienen esos otros dos eventos con elementos anidados.
      if (isInfo && dieSvg) {
        var overUi = isOverUi();
        if (overUi && !dot.classList.contains("circle")) showCircle();
        else if (!overUi && !dot.classList.contains("die")) showDie();
      }
    });
    (function tick() {
      curX += (targetX - curX) * 0.15;
      curY += (targetY - curY) * 0.15;
      dot.style.left = curX + "px";
      dot.style.top = curY + "px";
      requestAnimationFrame(tick);
    })();

    // Hook para que info-chat.html anime el dado mientras carga la imagen
    // siguiente (reveal()) y para que trabe el cursor en círculo mientras
    // una ventana está ampliada (expand()/collapse()) — expuesto en window
    // porque footer.html se incluye DESPUÉS de info-chat.html en la
    // página: en el momento en que corre el script de info-chat.html este
    // <script> todavía no se ejecutó, así que no hay forma de pasarse una
    // referencia directa. Para cuando el visitante llega a clickear (mucho
    // después del DOMContentLoaded que arma esto), el hook ya existe.
    if (isInfo) {
      var rollTimer = null;
      window.__infoCursorDie = {
        start: function () {
          if (rollTimer) return;
          rollTimer = setInterval(function () { setDieFace(dieSvg, randomFace()); }, 90);
        },
        stop: function () {
          if (rollTimer) { clearInterval(rollTimer); rollTimer = null; }
          setDieFace(dieSvg, randomFace());
        },
        lock: function () {
          expandedLock = true;
          showCircle();
        },
        unlock: function () {
          expandedLock = false;
          // No forzar el dado a ciegas: si el mouse quedó parado justo
          // sobre el botón "Achicar" (lo más probable, recién se clickeó),
          // isOverUi() lo detecta vía lastTarget y se queda en círculo —
          // el próximo mousemove ya lo resuelve solo si no fuera el caso.
          if (!isOverUi()) showDie();
        },
      };
    }
  });
</script>
{% endif %}
